<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Master</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:92%;
    max-width:700px;
    margin:auto;
    padding:25px 0;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.card{
    background:white;
    border-radius:25px;
    padding:30px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* HOME */

.home{
    text-align:center;
    margin-top:60px;
}

.logo{
    font-size:65px;
}

h1{
    font-size:42px;
    color:#5b4bc4;
    margin:10px 0;
}

.tagline{
    color:#666;
    font-size:18px;
    margin-bottom:30px;
}

.main-btn{
    border:0;
    padding:16px 35px;
    border-radius:50px;
    background:linear-gradient(135deg,#ff7b54,#ff4d6d);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:active{
    transform:scale(0.96);
}

.info{
    display:flex;
    gap:10px;
    margin-top:30px;
}

.info div{
    flex:1;
    background:#f3f3ff;
    padding:15px 5px;
    border-radius:15px;
}

/* SUBJECT */

.title{
    text-align:center;
    color:#5b4bc4;
    margin-bottom:25px;
}

.subjects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.subject{
    border:0;
    border-radius:20px;
    padding:25px 10px;
    background:#f2f1ff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.subject:active{
    transform:scale(0.96);
}

.subject span{
    display:block;
    font-size:40px;
    margin-bottom:10px;
}

/* QUIZ */

.quiz-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.badge,
.timer{
    padding:8px 13px;
    border-radius:20px;
    font-weight:bold;
}

.badge{
    background:#eeeaff;
}

.timer{
    background:#fff0f0;
    color:#e63946;
}

.progress-bg{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    margin-bottom:25px;
}

.progress{
    height:100%;
    width:0%;
    background:#5b4bc4;
    border-radius:20px;
}

.question{
    font-size:23px;
    line-height:1.4;
    margin-bottom:22px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    text-align:left;
    padding:16px;
    border:2px solid #ddd;
    border-radius:15px;
    background:white;
    font-size:17px;
    cursor:pointer;
}

.option:active{
    transform:scale(0.99);
}

.option.correct{
    background:#d9fbe5;
    border-color:#28a745;
}

.option.wrong{
    background:#ffe0e0;
    border-color:#dc3545;
}

.feedback{
    text-align:center;
    font-weight:bold;
    min-height:30px;
    margin:15px 0;
}

.next-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:15px;
    background:#5b4bc4;
    color:white;
    font-size:18px;
    cursor:pointer;
    display:none;
}

/* RESULT */

.result{
    text-align:center;
}

.result-icon{
    font-size:70px;
}

.score{
    font-size:55px;
    font-weight:bold;
    color:#5b4bc4;
    margin:15px;
}

.result-message{
    font-size:19px;
    margin-bottom:20px;
}

@media(max-width:500px){

    h1{
        font-size:35px;
    }

    .info{
        flex-direction:column;
    }

}

</style>
</head>

</div>


<!-- QUIZ -->

<div id="quiz" class="screen">

        </div>

    </div>

</div>


<!-- RESULT -->

<div id="result" class="screen">

    <div class="card result">

        <div class="result-icon">
            🏆
        </div>

        <h2 class="title">
            Quiz Complete!
        </h2>

        <div class="score">

            <span id="finalScore">

            </span>
            /10

        </div>

        <p
            id="resultMessage"
            class="result-message">
        </p>

        <p>
            🔥 Best Streak:

        </p>

        <br>

        <button
            class="main-btn"
            onclick="restartQuiz()">

            🔄 Play Again

        </button>

        <br><br>

        <button
            class="subject"
            onclick="openSubjects()">

            📚 Choose Subject

    </div>

</div>

/* =========================
   VARIABLES
========================= */

var currentSubject = "";
var questions = [];
var currentQuestion = 0;
var score = 0;
var streak = 0;
var bestStreak = 0;
var timeLeft = 20;
var timer = null;
var answered = false;


/* =========================
   SCREEN FUNCTION
========================= */

function showScreen(id){

    var screens = document.querySelectorAll(".screen");

    for(var i=0;i<screens.length;i++){

        screens[i].classList.remove("active");

    }

    document.getElementById(id).classList.add("active");
}


/* =========================
   OPEN SUBJECTS
========================= */

function openSubjects(){

    clearInterval(timer);

    showScreen("subjects");

}


/* =========================
   START QUIZ
========================= */

function startQuiz(subject){

    currentSubject = subject;

    questions = quizData[subject];

    currentQuestion = 0;

    score = 0;

    streak = 0;

    bestStreak = 0;

    showScreen("quiz");

    loadQuestion();

}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    clearInterval(timer);

    answered = false;

    timeLeft = 20;

    var data = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML =
        data.q;

    document.getElementById("time").innerHTML =
        timeLeft;

    document.getElementById("feedback").innerHTML =
        "";

    document.getElementById("progress").style.width =
        ((currentQuestion / questions.length) * 100) + "%";

    document.getElementById("nextButton").style.display =
        "none";


    var box =
        document.getElementById("options");

    box.innerHTML = "";


    for(var i=0;i<data.options.length;i++){

        var button =
            document.createElement("button");

        button.className = "option";

        button.innerHTML =
            String.fromCharCode(65+i)
            + ". "
            + data.options[i];

        button.onclick =
            (function(index,btn){

                return function(){

                    selectAnswer(index,btn);

                };

            })(i,button);


        box.appendChild(button);

    }


    timer = setInterval(function(){

        timeLeft--;

        document.getElementById("time").innerHTML =
            timeLeft;

        if(timeLeft <= 0){

            clearInterval(timer);

            if(!answered){

                timeUp();

            }

        }

    },1000);

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index,button){

    if(answered){
        return;
    }

    answered = true;

    clearInterval(timer);

    var data = questions[currentQuestion];

    var buttons =
        document.querySelectorAll(".option");


    for(var i=0;i<buttons.length;i++){

        buttons[i].disabled = true;

    }


    if(index === data.answer){

        score++;

        streak++;

        if(streak > bestStreak){

            bestStreak = streak;

        }

        button.classList.add("correct");

        document.getElementById("feedback").innerHTML =
            "✅ Correct! 🔥 " + streak + " Streak";

    }

    else{

        streak = 0;

        button.classList.add("wrong");

        buttons[data.answer].classList.add("correct");

        document.getElementById("feedback").innerHTML =
            "❌ Wrong Answer!";

    }


    document.getElementById("nextButton").style.display =
        "block";

}


/* =========================
   TIME UP
========================= */

function timeUp(){

    answered = true;

    streak = 0;

    var data = questions[currentQuestion];

    var buttons =
        document.querySelectorAll(".option");


    for(var i=0;i<buttons.length;i++){

        buttons[i].disabled = true;

        if(i === data.answer){

            buttons[i].classList.add("correct");

        }

    }


    document.getElementById("feedback").innerHTML =
        "⏰ Time Up!";


    document.getElementById("nextButton").style.display =
        "block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        showResult();

    }

    else{

        loadQuestion();

    }

}


/* =========================
   RESULT
========================= */

function showResult(){

    clearInterval(timer);

    showScreen("result");

    document.getElementById("finalScore").innerHTML =
        score;

    document.getElementById("bestStreak").innerHTML =
        bestStreak;


    var percentage =
        (score / questions.length) * 100;

    var message = "";


    if(percentage === 100){

        message =
            "🏆 Perfect! बहुत शानदार!";

    }

    else if(percentage >= 80){

        message =
            "🌟 Excellent! बहुत अच्छा!";

    }

    else if(percentage >= 60){

        message =
            "👏 Great Job! थोड़ी और practice करो।";

    }

    else if(percentage >= 40){

        message =
            "💪 अच्छा प्रयास! फिर से कोशिश करो।";

    }

    else{

        message =
            "📚 कोई बात नहीं! Practice करते रहो।";

    }


    document.getElementById("resultMessage").innerHTML =
        message;

}


/* =========================
   RESTART
========================= */

function restartQuiz(){

    startQuiz(currentSubject);

}
